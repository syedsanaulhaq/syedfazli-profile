<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Manrope', 'Segoe UI', Arial, sans-serif; background: #0a0a0a; }

  .banner {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
  }

  /* Photo background */
  .bg-photo {
    position: absolute;
    inset: 0;
    background: url('./10408.jpg') center top / cover no-repeat;
    filter: brightness(0.85);
  }

  /* Dark gradient overlay — bottom two-thirds readable */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(0,0,0,0.0)   0%,
      rgba(0,0,0,0.1)  25%,
      rgba(0,0,0,0.55) 48%,
      rgba(5,20,18,0.92) 68%,
      rgba(5,20,18,1.0) 100%
    );
  }

  /* Subtle teal tint at very bottom edge */
  .overlay::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(to top, rgba(13,107,93,0.18), transparent);
  }

  /* Content sits above overlays */
  .content {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    padding: 0 72px 70px;
    z-index: 2;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(13,107,93,0.3);
    border: 1px solid rgba(78,205,196,0.45);
    color: #4ecdc4;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 100px;
    margin-bottom: 20px;
  }
  .badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ecdc4;
    box-shadow: 0 0 6px #4ecdc4;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  h1 {
    font-size: 68px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.05;
    margin-bottom: 8px;
    letter-spacing: -1.5px;
  }
  h1 em {
    font-style: normal;
    color: #4ecdc4;
  }

  .subtitle {
    font-size: 22px;
    color: rgba(255,255,255,0.75);
    font-weight: 600;
    margin-bottom: 28px;
    letter-spacing: 0.2px;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-bottom: 36px;
  }
  .pill {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.14);
    color: rgba(255,255,255,0.85);
    font-size: 13.5px;
    font-weight: 600;
    padding: 6px 15px;
    border-radius: 6px;
    letter-spacing: 0.2px;
  }

  .bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .cta {
    display: inline-block;
    background: #d98f49;
    color: #0a0a0a;
    font-size: 17px;
    font-weight: 800;
    padding: 14px 36px;
    border-radius: 100px;
    letter-spacing: 0.2px;
  }

  .stats {
    display: flex;
    gap: 32px;
    align-items: center;
  }
  .stat {
    text-align: right;
  }
  .stat .num {
    font-size: 30px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
  }
  .stat .lbl {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 600;
    margin-top: 2px;
  }
  .stat-sep {
    width: 1px;
    height: 38px;
    background: rgba(255,255,255,0.12);
  }

  /* Top-left branding */
  .brand {
    position: absolute;
    top: 52px;
    left: 72px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .brand-mark {
    width: 44px; height: 44px;
    border-radius: 10px;
    background: #0d6b5d;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; font-weight: 800; color: white; letter-spacing: -1px;
  }
  .brand-name {
    font-size: 18px;
    font-weight: 700;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.3px;
  }
  .brand-url {
    font-size: 13px;
    color: rgba(255,255,255,0.45);
    font-weight: 500;
    margin-top: 1px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="bg-photo"></div>
  <div class="overlay"></div>

  <!-- Top-left brand -->
  <div class="brand">
    <div class="brand-mark">SF</div>
    <div>
      <div class="brand-name">Syed Fazli</div>
      <div class="brand-url">syedfazli.com</div>
    </div>
  </div>

  <!-- Bottom content -->
  <div class="content">
    <div class="badge"><span class="dot"></span> Available for Projects</div>
    <h1>Full-Stack &amp; LMS<br><em>Developer</em></h1>
    <p class="subtitle">AI-powered platforms · Moodle LMS · Enterprise automation</p>
    <div class="pills">
      <span class="pill">React</span>
      <span class="pill">Node.js</span>
      <span class="pill">Moodle LMS</span>
      <span class="pill">PHP / MySQL</span>
      <span class="pill">Python</span>
      <span class="pill">Power BI</span>
      <span class="pill">Automation</span>
    </div>
    <div class="bottom-row">
      <a class="cta">Work With Me</a>
      <div class="stats">
        <div class="stat">
          <div class="num">8+</div>
          <div class="lbl">Yrs Exp</div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat">
          <div class="num">50+</div>
          <div class="lbl">Projects</div>
        </div>
        <div class="stat-sep"></div>
        <div class="stat">
          <div class="num">3</div>
          <div class="lbl">Countries</div>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
