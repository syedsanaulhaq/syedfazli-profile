<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 627px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; }

  .banner {
    width: 1200px;
    height: 627px;
    background: linear-gradient(135deg, #0d1f1c 0%, #0d2e28 50%, #0a1a17 100%);
    position: relative;
    display: flex;
    align-items: center;
    padding: 60px 80px;
    overflow: hidden;
  }

  /* background grid pattern */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(13,107,93,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,107,93,0.08) 1px, transparent 1px);
    background-size: 48px 48px;
  }

  /* glow orb */
  .orb {
    position: absolute;
    right: -80px;
    top: -100px;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13,107,93,0.25) 0%, transparent 70%);
    pointer-events: none;
  }
  .orb2 {
    position: absolute;
    left: -100px;
    bottom: -120px;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217,143,73,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .left {
    flex: 1;
    position: relative;
    z-index: 2;
  }

  .available-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(13,107,93,0.25);
    border: 1px solid rgba(13,107,93,0.5);
    color: #4ecdc4;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 16px;
    border-radius: 100px;
    margin-bottom: 24px;
  }
  .available-badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ecdc4;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-size: 52px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.1;
    margin-bottom: 10px;
    letter-spacing: -1px;
  }
  h1 span { color: #0d6b5d; }

  .subtitle {
    font-size: 20px;
    color: #d98f49;
    font-weight: 600;
    margin-bottom: 32px;
    letter-spacing: 0.3px;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 36px;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #ccc;
    font-size: 13px;
    font-weight: 500;
    padding: 6px 14px;
    border-radius: 6px;
  }

  .url {
    font-size: 18px;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .url span { color: #0d6b5d; }

  .right {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 16px;
  }

  .initials-circle {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0d6b5d, #0a4f45);
    border: 3px solid rgba(13,107,93,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 52px;
    font-weight: 800;
    color: white;
    letter-spacing: -2px;
    box-shadow: 0 0 60px rgba(13,107,93,0.4);
  }

  .stats {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
  }
  .stat {
    text-align: right;
  }
  .stat .num {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
  }
  .stat .label {
    font-size: 12px;
    color: #888;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .divider {
    width: 1px;
    height: 80px;
    background: rgba(255,255,255,0.08);
    margin: 0 60px;
  }
</style>
</head>
<body>
<div class="banner">
  <div class="orb"></div>
  <div class="orb2"></div>

  <div class="left">
    <div class="available-badge">
      <span class="dot"></span>
      Available for Projects
    </div>
    <h1>Syed <span>Fazli</span></h1>
    <p class="subtitle">AI-Powered Full-Stack &amp; LMS Developer</p>
    <div class="pills">
      <span class="pill">Moodle LMS</span>
      <span class="pill">React</span>
      <span class="pill">Node.js</span>
      <span class="pill">PHP / MySQL</span>
      <span class="pill">Python</span>
      <span class="pill">Power BI</span>
      <span class="pill">Automation</span>
    </div>
    <p class="url">🌐 <span>syedfazli.com</span></p>
  </div>

  <div class="divider"></div>

  <div class="right">
    <div class="initials-circle">SF</div>
    <div class="stats">
      <div class="stat">
        <div class="num">20+</div>
        <div class="label">Years Experience</div>
      </div>
      <div class="stat">
        <div class="num">50+</div>
        <div class="label">Projects Delivered</div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
