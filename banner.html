<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1080px; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; background: #0a0a0a; }

  .banner {
    width: 1080px;
    height: 1080px;
    background: linear-gradient(160deg, #0d1f1c 0%, #0d2e28 55%, #0a1a17 100%);
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 80px 90px;
    overflow: hidden;
    text-align: center;
  }

  /* background grid pattern */
  .banner::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(13,107,93,0.08) 1px, transparent 1px),
      linear-gradient(90deg, rgba(13,107,93,0.08) 1px, transparent 1px);
    background-size: 54px 54px;
  }

  /* glow orbs */
  .orb {
    position: absolute;
    right: -120px;
    top: -120px;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(13,107,93,0.22) 0%, transparent 70%);
    pointer-events: none;
  }
  .orb2 {
    position: absolute;
    left: -120px;
    bottom: -140px;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(217,143,73,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .content {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    width: 100%;
  }

  .initials-circle {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0d6b5d, #0a4f45);
    border: 3px solid rgba(13,107,93,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    font-weight: 800;
    color: white;
    letter-spacing: -2px;
    box-shadow: 0 0 70px rgba(13,107,93,0.45);
    margin-bottom: 28px;
  }

  .available-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(13,107,93,0.25);
    border: 1px solid rgba(13,107,93,0.5);
    color: #4ecdc4;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 7px 18px;
    border-radius: 100px;
    margin-bottom: 22px;
  }
  .available-badge .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #4ecdc4;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  h1 {
    font-size: 64px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1.05;
    margin-bottom: 14px;
    letter-spacing: -1.5px;
  }
  h1 span { color: #0d6b5d; }

  .subtitle {
    font-size: 22px;
    color: #d98f49;
    font-weight: 600;
    margin-bottom: 36px;
    letter-spacing: 0.3px;
  }

  .pills {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 44px;
    max-width: 780px;
  }
  .pill {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #ccc;
    font-size: 14px;
    font-weight: 500;
    padding: 7px 16px;
    border-radius: 6px;
  }

  .stats-row {
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 40px;
  }
  .stat {
    text-align: center;
    padding: 0 40px;
  }
  .stat .num {
    font-size: 36px;
    font-weight: 800;
    color: #ffffff;
    line-height: 1;
  }
  .stat .label {
    font-size: 12px;
    color: #888;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
  }
  .stat-divider {
    width: 1px;
    height: 48px;
    background: rgba(255,255,255,0.1);
  }

  .url {
    font-size: 20px;
    color: #ffffff;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .url span { color: #4ecdc4; }
</style>
</head>
<body>
<div class="banner">
  <div class="orb"></div>
  <div class="orb2"></div>

  <div class="content">
    <div class="initials-circle">SF</div>
    <div class="available-badge">
      <span class="dot"></span>
      Available for Projects
    </div>
    <h1>Syed <span>Fazli</span></h1>
    <p class="subtitle">AI-Powered Full-Stack &amp; LMS Developer</p>
    <div class="pills">
      <span class="pill">Moodle LMS</span>
      <span class="pill">React</span>
      <span class="pill">Node.js</span>
      <span class="pill">PHP / MySQL</span>
      <span class="pill">Python</span>
      <span class="pill">Power BI</span>
      <span class="pill">Automation</span>
    </div>
    <div class="stats-row">
      <div class="stat">
        <div class="num">8+</div>
        <div class="label">Years Experience</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="num">50+</div>
        <div class="label">Projects Delivered</div>
      </div>
      <div class="stat-divider"></div>
      <div class="stat">
        <div class="num">3</div>
        <div class="label">Countries</div>
      </div>
    </div>
    <p class="url">🌐 <span>syedfazli.com</span></p>
  </div>
</div>
</body>
</html>
